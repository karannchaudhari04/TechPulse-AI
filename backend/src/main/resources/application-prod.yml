# application-prod.yml - Resource limits are environment-overridable for the target host.
server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:80}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:8}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:2048}
    accept-count: ${TOMCAT_ACCEPT_COUNT:500}

spring:
  datasource:
    writer:
      url: ${DATABASE_WRITER_URL}
      username: ${DATABASE_WRITER_USER}
      password: ${DATABASE_WRITER_PASSWORD}
      hikari:
        maximum-pool-size: ${DB_WRITER_POOL_SIZE:10}
        minimum-idle: 1
        connection-timeout: 20000
    replica:
      url: ${DATABASE_REPLICA_URL:${DATABASE_WRITER_URL}}
      username: ${DATABASE_REPLICA_USER:${DATABASE_WRITER_USER}}
      password: ${DATABASE_REPLICA_PASSWORD:${DATABASE_WRITER_PASSWORD}}
      hikari:
        maximum-pool-size: ${DB_REPLICA_POOL_SIZE:10}
        minimum-idle: 1
        connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      repositories:
        enabled: false
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      timeout: 5000ms

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.techpulse: INFO
    org.hibernate.SQL: WARN
    org.springframework.jdbc.datasource: WARN

app:
  gemini:
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  discovery:
    thread-pool-size: 2


