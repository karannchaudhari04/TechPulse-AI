# application-prod.yml - Tuned for ultra-lean memory container environments (Render 512MB)
server:
  tomcat:
    threads:
      max: 10
      min-spare: 2
    max-connections: 50
    accept-count: 10

spring:
  datasource:
    writer:
      url: ${DATABASE_WRITER_URL}
      username: ${DATABASE_WRITER_USER}
      password: ${DATABASE_WRITER_PASSWORD}
      hikari:
        maximum-pool-size: 2
        minimum-idle: 1
        connection-timeout: 20000
    replica:
      url: ${DATABASE_REPLICA_URL:${DATABASE_WRITER_URL}}
      username: ${DATABASE_REPLICA_USER:${DATABASE_WRITER_USER}}
      password: ${DATABASE_REPLICA_PASSWORD:${DATABASE_WRITER_PASSWORD}}
      hikari:
        maximum-pool-size: 2
        minimum-idle: 1
        connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000ms

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.techpulse: INFO
    org.hibernate.SQL: WARN
    org.springframework.jdbc.datasource: WARN

app:
  gemini:
    model: gemini-flash-latest
  discovery:
    thread-pool-size: 2


