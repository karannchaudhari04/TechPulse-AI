spring:
  profiles:
    active: dev
  datasource:
    writer:
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        connection-timeout: 60000
        maximum-pool-size: 10

    replica:
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        connection-timeout: 60000
        maximum-pool-size: 20

  # JPA is now manually configured in DatabaseConfig.java for production stability
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update # Keep for local dev/initial setup

  data:
    redis:
      repositories:
        enabled: false
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}

  ai:
    openai:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      explain-api-key: ${GEMINI_EXPLAIN_API_KEY:}

jwt:
  expiration: 86400000

android:
  sha256:
    fingerprint: ${ANDROID_SHA256_FINGERPRINT:71:BC:9C:71:07:82:E2:3C:F8:55:A2:33:16:F7:FA:4C:FF:18:E5:B0:08:AD:49:BC:60:09:47:43:1F:57:44:B3}

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}

logging:
  level:
    com.techpulse: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.jdbc.datasource: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: false

app:
  web-origin: ${WEB_APP_ORIGIN:https://techpulse.onrender.com}
  rate-limit:
    ai:
      per-user-per-minute: ${AI_RATE_LIMIT_PER_USER_PER_MINUTE:12}
      per-ip-per-minute: ${AI_RATE_LIMIT_PER_IP_PER_MINUTE:30}
  gemini:
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.8-flash,gemini-3.6-flash}
  news:
    ingestion:
      enabled: true
      max-articles: ${NEWS_MAX_ARTICLES_PER_INGESTION:20}
  discovery:
    thread-pool-size: 10
