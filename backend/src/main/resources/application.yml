spring:
  profiles:
    active: dev
  datasource:
    writer:
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        connection-timeout: 60000
        maximum-pool-size: 10

    replica:
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        connection-timeout: 60000
        maximum-pool-size: 20

  # JPA is now manually configured in DatabaseConfig.java for production stability
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update # Keep for local dev/initial setup

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:redis}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}

  ai:
    openai:
      api-key: ${GEMINI_API_KEY:mock-gemini-key}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      explain-api-key: ${GEMINI_EXPLAIN_API_KEY:${GEMINI_API_KEY:mock-gemini-key}}

jwt:
  secret: ${JWT_SECRET:9a76a1c84b5c7f8a9e102b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e}
  expiration: 86400000

android:
  sha256:
    fingerprint: ${ANDROID_SHA256_FINGERPRINT:71:BC:9C:71:07:82:E2:3C:F8:55:A2:33:16:F7:FA:4C:FF:18:E5:B0:08:AD:49:BC:60:09:47:43:1F:57:44:B3}

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}

logging:
  level:
    com.techpulse: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.jdbc.datasource: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: false

app:
  gemini:
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  discovery:
    thread-pool-size: 10
  news:
    ingestion:
      enabled: true