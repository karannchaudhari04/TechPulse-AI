# application-dev.yml
spring:
  datasource:
    writer:
      url: ${DATABASE_WRITER_URL:jdbc:h2:mem:techpulse;DB_CLOSE_DELAY=-1;MODE=MySQL}
      username: ${DATABASE_WRITER_USER:sa}
      password: ${DATABASE_WRITER_PASSWORD:}
    replica:
      url: ${DATABASE_REPLICA_URL:${DATABASE_WRITER_URL:jdbc:h2:mem:techpulse;DB_CLOSE_DELAY=-1;MODE=MySQL}}
      username: ${DATABASE_REPLICA_USER:${DATABASE_WRITER_USER:sa}}
      password: ${DATABASE_REPLICA_PASSWORD:${DATABASE_WRITER_PASSWORD:}}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}

app:
  gemini:
    model: gemini-flash-latest
