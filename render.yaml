# render.yaml — Django API on Render
# Render reads this file automatically from your GitHub repo
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: techbite
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: techbite.onrender.com
      - key: WEB_APP_ORIGIN
        value: https://techbite.onrender.com
      - key: DATABASE_WRITER_URL
        sync: false
      - key: DATABASE_WRITER_USER
        sync: false
      - key: DATABASE_WRITER_PASSWORD
        sync: false
      - key: DATABASE_REPLICA_URL
        sync: false
      - key: DATABASE_REPLICA_USER
        sync: false
      - key: DATABASE_REPLICA_PASSWORD
        sync: false
      # Render Redis (same-region internal URL, no password). Celery uses it as
      # broker/result backend and Django as the cache, so keep it in sync with
      # the Redis instance in the Render dashboard.
      - key: REDIS_URL
        value: redis://red-d7tl3a1kh4rs73aruutg:6379
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EXPLAIN_API_KEY
        sync: false
      # The web process runs ingestion, pruning, and the digest in a background
      # thread (the Django equivalent of the Java @Scheduled jobs). Keep this
      # true unless a Celery worker/beat takes over the schedule.
      - key: INGESTION_SCHEDULER_ENABLED
        value: "true"
      # The Java backend seeded news sources and categories on startup. Without
      # sources discovery finds nothing, so the entrypoint keeps this enabled.
      - key: SEED_REFERENCE_DATA
        value: "true"
      # 48h instead of the Java port's hard-coded 24h, so feeds that publish a
      # few times a week still reach the pipeline. Duplicates are filtered later.
      - key: NEWS_FRESHNESS_HOURS
        value: "48"

  # Scheduled ingestion (every 8h), midnight pruning, and the 09:00 digest run
  # in-process by default (INGESTION_SCHEDULER_ENABLED=true), because Render's
  # free plan provides no always-on worker. The optional Celery worker below is
  # only needed on a paid plan or when the in-process scheduler is disabled;
  # uncomment it and mirror the web service's env vars.
  #
  # - type: worker
  #   name: techbite-worker
  #   runtime: docker
  #   dockerfilePath: ./backend/Dockerfile
  #   dockerContext: ./backend
  #   dockerCommand: celery -A config worker --beat --loglevel=info
  #   plan: starter
  #   envVars:
  #     - key: RUN_MIGRATIONS
  #       value: "false"
  #     - key: COLLECT_STATIC
  #       value: "false"
  #     # Add DATABASE_*, REDIS_URL, FIREBASE_*, and GEMINI_* entries here,
  #     # using the same values as the techbite web service.
  #
  # Optional extra safety net for a paid plan: a Render cron job runs the same
  # pipeline synchronously without Celery. Cron jobs bill per second with a
  # $1/month minimum per job.
  #
  # - type: cron
  #   name: techbite-ingest
  #   runtime: docker
  #   dockerfilePath: ./backend/Dockerfile
  #   dockerContext: ./backend
  #   schedule: "0 */8 * * *"
  #   dockerCommand: python manage.py ingest_news
  #   plan: 0.5c-512mb
  #   envVars:
  #     - key: RUN_MIGRATIONS
  #       value: "false"
  #     - key: COLLECT_STATIC
  #       value: "false"
  #     - key: DJANGO_SECRET_KEY
  #       fromService:
  #         type: web
  #         name: techbite
  #         envVarKey: DJANGO_SECRET_KEY
  #     - key: DATABASE_WRITER_URL
  #       fromService:
  #         type: web
  #         name: techbite
  #         envVarKey: DATABASE_WRITER_URL
  #     - key: DATABASE_WRITER_USER
  #       fromService:
  #         type: web
  #         name: techbite
  #         envVarKey: DATABASE_WRITER_USER
  #     - key: DATABASE_WRITER_PASSWORD
  #       fromService:
  #         type: web
  #         name: techbite
  #         envVarKey: DATABASE_WRITER_PASSWORD
  #     - key: GEMINI_API_KEY
  #       fromService:
  #         type: web
  #         name: techbite
  #         envVarKey: GEMINI_API_KEY
  #     # REDIS_URL is optional: the command fails open when the cache is
  #     # unreachable. Copy it from the web service to keep caching identical.
